name: Umbraco Cloud Sync

on:
  workflow_call:
    outputs:
      newSha:
        description: 'The new SHA hash if there was a patch'
        value: ${{ jobs.applyRemoteChanges.outputs.newSha }}
    inputs:
      targetEnvironmentAlias:
        description: 'The target environment alias to sync with'
        required: true
        type: string
      runner-platform:
        required: true
        type: string
        default: 'self-hosted'
    secrets:
      projectId:
        required: true
      umbracoCloudApiKey:
        required: true
      postmarkServerToken:
        description: 'Postmark Server API Token voor het versturen van failure-notificaties.'
        required: false

jobs:
  preflight:
    name: Check Cloud for changes
    runs-on: ["${{ inputs.runner-platform }}"]
    steps:
      - uses: actions/checkout@v6
      - name: Get Latest Deployment
        id: latest-deployment
        shell: pwsh
        run: >
          ${{GITHUB.WORKSPACE}}/.github/powershell/Get-LatestDeployment.ps1
          -ProjectId ${{ secrets.projectId }}
          -ApiKey ${{ secrets.umbracoCloudApiKey }}
          -TargetEnvironmentAlias ${{ inputs.targetEnvironmentAlias }}
          -PipelineVendor GITHUB
    outputs:
      latestDeploymentId: ${{ steps.latest-deployment.outputs.latestDeploymentId }}

  checkForChanges:
    name: Check if there are changes since latest deployment
    needs: preflight
    runs-on: ["${{ inputs.runner-platform }}"]
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Changes From Cloud
        env:
          latestDeploymentId: ${{ needs.preflight.outputs.latestDeploymentId }}
        if: ${{ env.latestDeploymentId != '' }}
        id: latest-changes
        shell: pwsh
        run: >
          ${{GITHUB.WORKSPACE}}/.github/powershell/Get-ChangesById.ps1
          -ProjectId ${{ secrets.projectId }}
          -ApiKey ${{ secrets.umbracoCloudApiKey }}
          -DeploymentId ${{ env.latestDeploymentId }}
          -TargetEnvironmentAlias ${{ inputs.targetEnvironmentAlias }}
          -DownloadFolder ${{GITHUB.WORKSPACE}}/patch
          -PipelineVendor GITHUB

      - name: Strip build-managed files from patch
        if: ${{ steps.latest-changes.outputs.remoteChanges == 'yes' }}
        shell: pwsh
        run: |
          # Bestanden die door de build/deploy-workflow worden gezet en dus altijd
          # afwijken van Cloud (bv. RuntimeMinification.version). Uit de patch strippen
          # zodat git apply niet faalt op een conflict dat we sowieso niet willen syncen.
          $patch = "${{ GITHUB.WORKSPACE }}/patch/git-patch.diff"
          $exclude = @('appsettings.json')
          $raw = [IO.File]::ReadAllText($patch)
          $blocks = [regex]::Split($raw, '(?=^diff --git )', [Text.RegularExpressions.RegexOptions]::Multiline) | Where-Object { $_ -ne '' }
          $kept = foreach ($b in $blocks) {
              $header = ($b -split "`n")[0]
              $drop = $false
              foreach ($p in $exclude) {
                  if ($header -match 'diff --git a/(.+?) b/' -and $Matches[1] -like "*$p") { $drop = $true; break }
              }
              if ($drop) { Write-Host "Excluding from patch: $($header.Trim())"; continue }
              $b
          }
          [IO.File]::WriteAllText($patch, ($kept -join ''))

      - name: See diff content if any
        if: ${{ steps.latest-changes.outputs.remoteChanges == 'yes' }}
        shell: pwsh
        run: get-content ${{ GITHUB.WORKSPACE }}/patch/git-patch.diff

      - name: Store diff before applying
        if: ${{ steps.latest-changes.outputs.remoteChanges == 'yes' }}
        uses: actions/upload-artifact@v7
        with:
          name: git-patch
          path: ${{ GITHUB.WORKSPACE }}/patch/git-patch.diff
          retention-days: 1
    outputs:
      remoteChanges: ${{ steps.latest-changes.outputs.remoteChanges }}

  applyRemoteChanges:
    name: Apply remote changes
    needs: [preflight, checkForChanges]
    runs-on: ["${{ inputs.runner-platform }}"]
    steps:
      - uses: actions/checkout@v6
        env:
          remoteChanges: ${{ needs.checkForChanges.outputs.remoteChanges }}
        if: ${{ env.remoteChanges == 'yes' }}
        with:
          fetch-depth: 0

      - name: Get stored diff
        env:
          remoteChanges: ${{ needs.checkForChanges.outputs.remoteChanges }}
        if: ${{ env.remoteChanges == 'yes' }}
        uses: actions/download-artifact@v8
        with:
          name: git-patch
          path: ${{ GITHUB.WORKSPACE }}/patch

      - name: Applying git patch to branch
        id: update-bundle
        env:
          remoteChanges: ${{ needs.checkForChanges.outputs.remoteChanges }}
          latestDeploymentId: ${{ needs.preflight.outputs.latestDeploymentId }}
          gitName: github-actions
          gitEmail: github-actions@github.com
        if: ${{ env.remoteChanges == 'yes' }}
        shell: pwsh
        run: >
          ${{GITHUB.WORKSPACE}}/.github/powershell/Apply-Patch.ps1
          -PatchFile ${{ GITHUB.WORKSPACE }}/patch/git-patch.diff
          -LatestDeploymentId ${{ env.latestDeploymentId }}
          -PipelineVendor GITHUB
          -GitUserName ${{ env.gitName }}
          -GitUserEmail ${{ env.gitEmail }}
    outputs:
      newSha: ${{ steps.update-bundle.outputs.updatedSha }}

  notifyFailure:
    name: Notify on failed sync
    needs: [preflight, checkForChanges, applyRemoteChanges]
    # Vuurt bij elke gefaalde job in de sync; niet bij skips of geannuleerde runs.
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ["${{ inputs.runner-platform }}"]
    steps:
      - name: Send failure notification via Postmark
        shell: pwsh
        env:
          POSTMARK_TOKEN: ${{ secrets.postmarkServerToken }}
          # vars komen uit de caller repo/org: NOTIFICATION_FROM = geverifieerd Postmark
          # afzender-adres, NOTIFICATION_TO/CC = komma-gescheiden ontvangers.
          # NOTIFICATION_DEV_DOMAINS (optioneel) = komma-gescheiden e-maildomeinen
          # (bv. "axendo.nl"). Indien gezet gaat de mail naar de developer(s) die als
          # laatst aan de repository committen met een adres binnen die domeinen, en
          # schuiven NOTIFICATION_TO/CC door naar de CC. Niet gezet = huidig gedrag.
          # NOTIFICATION_DEV_LOGIN_MAP (optioneel) = komma-gescheiden mapping van
          # GitHub-login naar e-mailadres (bv. "frits-axendo=frits@axendo.nl,
          # RaymondJansen=raymond.jansen@axendo.nl") voor developers die met een
          # noreply-adres committen. De mapping gaat vóór het commit-e-mailadres.
          MAIL_FROM: ${{ vars.NOTIFICATION_FROM }}
          MAIL_TO: ${{ vars.NOTIFICATION_TO }}
          MAIL_CC: ${{ vars.NOTIFICATION_CC }}
          DEV_DOMAINS: ${{ vars.NOTIFICATION_DEV_DOMAINS }}
          DEV_LOGIN_MAP: ${{ vars.NOTIFICATION_DEV_LOGIN_MAP }}
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          TARGET: ${{ inputs.targetEnvironmentAlias }}
          DEPLOYMENT_ID: ${{ needs.preflight.outputs.latestDeploymentId }}
          RESULT_PREFLIGHT: ${{ needs.preflight.result }}
          RESULT_CHECK: ${{ needs.checkForChanges.result }}
          RESULT_APPLY: ${{ needs.applyRemoteChanges.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Notificatie is optioneel: als token/from/to niet is geconfigureerd, gewoon overslaan
          # zodat callers die dit (nog) niet hebben ingericht niet falen.
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:POSTMARK_TOKEN)) { $missing += 'postmarkServerToken (secret)' }
          if ([string]::IsNullOrWhiteSpace($env:MAIL_FROM)) { $missing += 'NOTIFICATION_FROM (var)' }
          if ([string]::IsNullOrWhiteSpace($env:MAIL_TO)) { $missing += 'NOTIFICATION_TO (var)' }
          if ($missing.Count -gt 0) {
              Write-Host "::warning::Postmark-notificatie niet geconfigureerd, ontbreekt: $($missing -join ', ') - overslaan."
              exit 0
          }

          # Dynamische ontvangers: de developer(s) die als laatst aan de repository hebben
          # gewerkt, bepaald via de commit-historie. Alleen actief wanneer
          # NOTIFICATION_DEV_DOMAINS is gezet; adressen buiten die domeinen (en bots)
          # worden nooit aangeschreven.
          $devRecipients = @()
          $unmappable = @()
          if (-not [string]::IsNullOrWhiteSpace($env:DEV_DOMAINS)) {
              $domains = $env:DEV_DOMAINS -split ',' | ForEach-Object { $_.Trim().TrimStart('@').ToLower() } | Where-Object { $_ }
              try {
                  $ghHeaders = @{
                      "Authorization" = "Bearer $($env:GH_TOKEN)"
                      "Accept"        = "application/vnd.github+json"
                  }
                  # Login-naar-e-mail-mapping voor developers die met een GitHub-noreply-adres
                  # committen; het commit-adres is dan onbruikbaar maar de login niet.
                  $loginMap = @{}
                  foreach ($pair in ($env:DEV_LOGIN_MAP -split ',')) {
                      $parts = "$pair".Trim() -split '=', 2
                      if ($parts.Count -eq 2 -and $parts[0].Trim() -and $parts[1].Trim()) {
                          $loginMap[$parts[0].Trim().ToLower()] = $parts[1].Trim().ToLower()
                      }
                  }

                  $uri = "$($env:API_URL)/repos/$($env:REPO)/commits?sha=$($env:GIT_SHA)&per_page=30"
                  $commits = Invoke-RestMethod -Uri $uri -Headers $ghHeaders
                  $candidates = foreach ($c in $commits) {
                      $login = "$($c.author.login)".ToLower()
                      $email = "$($c.commit.author.email)".ToLower()
                      if ($login -and $loginMap.ContainsKey($login)) { $loginMap[$login] }
                      elseif ($email) {
                          # Menselijke committers met een noreply-adres zonder mapping zijn
                          # onbereikbaar; verzamel ze zodat de mail dat kan melden.
                          if ($email -match 'noreply' -and $email -notmatch 'github-actions|\[bot\]' -and "$($c.author.type)" -ne 'Bot') {
                              $unmappable += "$($c.commit.author.name) - $email"
                          }
                          $email
                      }
                  }
                  $unmappable = @($unmappable | Select-Object -Unique)
                  if ($unmappable.Count -gt 0) {
                      Write-Host "Niet te herleiden committers (noreply zonder mapping): $($unmappable -join '; ')"
                  }
                  $devRecipients = @($candidates |
                      Where-Object { $_ -notmatch 'github-actions|\[bot\]|noreply' } |
                      Where-Object { $email = $_; @($domains | Where-Object { $email.EndsWith("@$_") }).Count -gt 0 } |
                      Select-Object -Unique |
                      Select-Object -First 3)
              }
              catch {
                  Write-Host "::warning::Ophalen commit-historie voor dynamische ontvangers mislukt: $($_.Exception.Message) - terugvallen op NOTIFICATION_TO."
              }
          }

          if ($devRecipients.Count -gt 0) {
              # Developers in de To; NOTIFICATION_TO/CC schuiven door naar de CC.
              $mailTo = $devRecipients -join ','
              $mailCc = @(($env:MAIL_TO -split ','); ($env:MAIL_CC -split ',')) |
                  ForEach-Object { "$_".Trim() } |
                  Where-Object { $_ -and $devRecipients -notcontains $_.ToLower() } |
                  Select-Object -Unique
              $mailCc = $mailCc -join ','
              Write-Host "Dynamische ontvangers uit commit-historie: $mailTo (cc: $mailCc)"
          }
          else {
              $mailTo = $env:MAIL_TO
              $mailCc = $env:MAIL_CC
          }

          # Bepaal welke job faalde voor een passende omschrijving in de mail.
          if ($env:RESULT_APPLY -eq 'failure') {
              $failedJob = 'Apply remote changes'
              $reason = 'De patch kon waarschijnlijk niet schoon worden toegepast (merge-conflict in Apply-Patch). De git-patch artifact hangt aan de run.'
          }
          elseif ($env:RESULT_CHECK -eq 'failure') {
              $failedJob = 'Check if there are changes since latest deployment'
              $reason = 'Het ophalen van de remote changes van Umbraco Cloud is mislukt.'
          }
          else {
              $failedJob = 'Check Cloud for changes (preflight)'
              $reason = 'Het ophalen van de laatste deployment is mislukt; controleer API-key, project-id en de aanwezigheid van de PowerShell-scripts.'
          }

          $deployment = if ([string]::IsNullOrWhiteSpace($env:DEPLOYMENT_ID)) { 'onbekend' } else { $env:DEPLOYMENT_ID }

          $audienceHtml = ''
          $audienceText = ''
          if ($devRecipients.Count -gt 0) {
              $audienceHtml = '<p><em>Je ontvangt deze mail omdat je volgens de commit-historie als laatst aan deze repository hebt gewerkt.</em></p>'
              $audienceText = 'Je ontvangt deze mail omdat je volgens de commit-historie als laatst aan deze repository hebt gewerkt.'
          }

          $unmappableHtml = ''
          $unmappableText = ''
          if ($unmappable.Count -gt 0) {
              $items = ($unmappable | ForEach-Object { "<li>$_</li>" }) -join ''
              $unmappableHtml = "<p><strong>Niet te herleiden committers</strong> (noreply-adres zonder mapping in NOTIFICATION_DEV_LOGIN_MAP):</p><ul>$items</ul>"
              $unmappableText = "Niet te herleiden committers (noreply-adres zonder mapping in NOTIFICATION_DEV_LOGIN_MAP):`n" + (($unmappable | ForEach-Object { "  - $_" }) -join "`n")
          }

          $subject = "[Umbraco Cloud Sync] MISLUKT - $($env:REPO) / $($env:TARGET)"

          $html = @"
          <h2>Umbraco Cloud Sync mislukt</h2>
          <p>De automatische sync van Umbraco Cloud naar de repository is mislukt.</p>
          <ul>
            <li><strong>Repository:</strong> $($env:REPO)</li>
            <li><strong>Target environment:</strong> $($env:TARGET)</li>
            <li><strong>Gefaalde job:</strong> $failedJob</li>
            <li><strong>Deployment ID:</strong> $deployment</li>
          </ul>
          <p>$reason</p>
          <p><a href="$($env:RUN_URL)">Bekijk de workflow-run &amp; logs</a></p>
          $unmappableHtml
          $audienceHtml
          "@

          $text = @"
          Umbraco Cloud Sync mislukt.

          Repository:   $($env:REPO)
          Target:       $($env:TARGET)
          Gefaalde job: $failedJob
          Deployment:   $deployment

          $reason
          Run & logs: $($env:RUN_URL)

          $unmappableText

          $audienceText
          "@

          $body = @{
              From          = $env:MAIL_FROM
              To            = $mailTo
              Subject       = $subject
              HtmlBody      = $html
              TextBody      = $text
              MessageStream = "outbound"
          }
          if (-not [string]::IsNullOrWhiteSpace($mailCc)) { $body.Cc = $mailCc }

          $headers = @{
              "Accept"                  = "application/json"
              "Content-Type"            = "application/json"
              "X-Postmark-Server-Token" = $env:POSTMARK_TOKEN
          }

          try {
              $json = $body | ConvertTo-Json -Depth 5
              $resp = Invoke-RestMethod -Uri "https://api.postmarkapp.com/email" -Method Post -Headers $headers -Body $json
              Write-Host "Notificatie verzonden. MessageID: $($resp.MessageID)"
          }
          catch {
              Write-Host "::error::Versturen Postmark-notificatie mislukt: $($_.Exception.Message)"
              if ($_.ErrorDetails) { Write-Host $_.ErrorDetails.Message }
              exit 1
          }

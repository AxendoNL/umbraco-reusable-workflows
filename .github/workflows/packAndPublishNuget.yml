name: Pack and Publish NuGet (GitHub Packages & Releases)

on:
  workflow_call:  # This makes it reusable
    inputs:
      PACKAGE_VERSION:
        description: "Version number extracted from Git tag"
        required: true
        type: string
      DOTNET_VERSION:
        description: "Dotnet SDK version to use"
        required: false
        type: string
        default: "8.0.x"
    secrets:
      NUGET_WRITE_AND_DELETE:
        required: true

jobs:
  pack-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Strip "v" Prefix from Version
        id: format_version
        shell: pwsh
        run: |
          $VERSION = "${{ inputs.PACKAGE_VERSION }}"
          $VERSION = $VERSION -replace "^v", ""  # remove the "v" from version tag or manual input
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Pack NuGet Packages
        run: |
          $projects = Get-ChildItem -Path $GITHUB_WORKSPACE -Recurse -Filter *.csproj
          if ($projects.Count -eq 0) {
              Write-Error "No .csproj files found! Check your repository structure."
              exit 1
          }
          if (-not $env:VERSION) {
              Write-Error "VERSION is not set! Check if tag extraction worked correctly."
              exit 1
          }
          foreach ($proj in $projects) {
              Write-Host "Packing $proj with version $env:VERSION"
              dotnet pack "$($proj.FullName)" --configuration Release --output nupkgs /p:PackageVersion=$env:VERSION
          }


      - name: Publish NuGet Packages to GitHub Packages (Replace Existing)
        run: |
          $packages = Get-ChildItem -Path nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
              dotnet nuget push $pkg.FullName `
                --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
                --api-key ${{ secrets.GITHUB_TOKEN  }} `
                --skip-duplicate
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "$env:VERSION"
          $files = Get-ChildItem -Path "nupkgs" -Filter "*.nupkg" | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) {
              Write-Error "No .nupkg files found in 'nupkgs' directory!"
              exit 1
          }
          gh release create "$VERSION" $files --title "Release $VERSION" --notes "Automatically published from GitHub Actions."


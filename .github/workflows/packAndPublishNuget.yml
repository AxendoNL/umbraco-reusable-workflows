name: Pack and Publish NuGet (GitHub Packages & Releases)

on:
  workflow_call:  # This makes it reusable
    inputs:
      STABLE_BRANCH_PATTERN:
        description: "Branch pattern for stable releases"
        required: true
        type: string
      GITVERSION_SPEC:
        description: "GitVersion version to use"
        required: false
        type: string
        default: "5.x"
      DOTNET_VERSION:
        description: "Dotnet SDK version to use"
        required: false
        type: string
        default: "8.0.x"
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  pack-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0
        with:
          versionSpec: ${{ inputs.GITVERSION_SPEC }}

      - name: Determine Version with Inline Config
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0
        with:
          useConfigFile: false
          configure: |
            mode: ContinuousDeployment
            branches:
              main:
                regex: ^main$
                tag: ''
                is-release-branch: true
              develop:
                regex: ^develop$
                tag: beta
                is-release-branch: false
              release:
                regex: ^release[/-]
                tag: rc
                is-release-branch: true
              feature:
                regex: ^feature[/-]
                tag: useBranchName
                is-release-branch: false
              stable:
                regex: ^${{ inputs.STABLE_BRANCH_PATTERN }}$
                tag: ''
                is-release-branch: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Pack NuGet Packages
        run: |
          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj
          foreach ($proj in $projects) {
              Write-Host "Packing $proj with version ${{ steps.gitversion.outputs.FullSemVer }}"
              dotnet pack $proj.FullName --configuration Release --output nupkgs /p:Version=${{ steps.gitversion.outputs.FullSemVer }}
          }

      - name: Publish NuGet Packages to GitHub Packages
        run: |
          $packages = Get-ChildItem -Path nupkgs -Filter *.nupkg
          foreach ($pkg in $packages) {
              dotnet nuget push $pkg.FullName `
                --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
                --api-key ${{ secrets.GITHUB_TOKEN }} `
                --skip-duplicate
          }

      - name: Create GitHub Release (Stable Only)
        if: startsWith(github.ref, 'refs/heads/v') || startsWith(github.ref, 'refs/heads/umbraco-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG_NAME="${{ steps.gitversion.outputs.FullSemVer }}"
          gh release create "$TAG_NAME" nupkgs/*.nupkg --title "Release $TAG_NAME" --notes "Automatically published from GitHub Actions."
